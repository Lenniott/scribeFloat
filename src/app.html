<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scribefloat</title>
    <script>
      // Apply saved theme before first paint to prevent flash-of-wrong-theme.
      // Mirrors the logic in theme.ts — keep in sync if ThemeMode changes.
      try {
        var saved = localStorage.getItem('sf_theme_mode') || 'system';
        var resolved = saved === 'dark' ? 'dark'
          : saved === 'light' ? 'light'
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = resolved;
      } catch (_) {}
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
