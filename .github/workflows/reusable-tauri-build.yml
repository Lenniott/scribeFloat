# Called by release.yml — one platform/target per invocation.
name: Reusable Tauri build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      target:
        required: true
        type: string
      artifact_path:
        required: true
        type: string
      artifact_name:
        required: true
        type: string
      extra_cmake_args:
        required: false
        type: string
        default: ''
      bundle_nsis:
        required: false
        type: boolean
        default: false
      timeout_minutes:
        required: false
        type: number
        default: 360

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ${{ inputs.os }}
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-${{ inputs.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ inputs.target }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # macOS: Tauri imports APPLE_CERTIFICATE (.p12) and signs with that cert's identity.
      # Do not set APPLE_SIGNING_IDENTITY unless it is a substring of the p12 identity
      # (tauri-bundler: certificate_identity.contains(identity)).
      - name: Cache vcpkg (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v5
        with:
          path: C:\vcpkg\installed
          key: vcpkg-openblas-x64-windows-${{ hashFiles('.github/workflows/reusable-tauri-build.yml') }}

      - name: Install OpenBLAS (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install openblas:x64-windows
          # cygpath converts the Windows-style VCPKG_INSTALLATION_ROOT (C:\vcpkg) to a
          # POSIX path (/c/vcpkg) so bash file operations work without mixed separators.
          VCPKG="$(cygpath "${VCPKG_INSTALLATION_ROOT:-C:\\vcpkg}")"
          OPENBLAS_BIN="${VCPKG}/installed/x64-windows/bin"
          OPENBLAS_LIB="${VCPKG}/installed/x64-windows/lib"
          echo "OPENBLAS_PATH=${VCPKG}/installed/x64-windows" >> "$GITHUB_ENV"
          echo "BLAS_INCLUDE_DIRS=${VCPKG}/installed/x64-windows/include" >> "$GITHUB_ENV"
          # Override config.toml's global GGML_*=Apple values so they don't reach
          # whisper-rs-sys build.rs's env-var loop on Windows. cargo [env] only sets
          # vars not already in the process environment (force=false), so these win.
          echo "GGML_BLAS_VENDOR=OpenBLAS" >> "$GITHUB_ENV"
          echo "GGML_ACCELERATE=OFF" >> "$GITHUB_ENV"
          # whisper-rs-sys 0.15 links 'libopenblas' on Windows. vcpkg may install the
          # DLL as 'openblas.dll' (no lib prefix). Create libopenblas.* aliases so the
          # linker and runtime both find the right name.
          for pfx in "" lib; do
            src="${pfx}openblas"
            if [ -f "${OPENBLAS_LIB}/${src}.lib" ] && [ ! -f "${OPENBLAS_LIB}/libopenblas.lib" ]; then
              cp "${OPENBLAS_LIB}/${src}.lib" "${OPENBLAS_LIB}/libopenblas.lib"
            fi
            if [ -f "${OPENBLAS_BIN}/${src}.dll" ] && [ ! -f "${OPENBLAS_BIN}/libopenblas.dll" ]; then
              cp "${OPENBLAS_BIN}/${src}.dll" "${OPENBLAS_BIN}/libopenblas.dll"
            fi
          done
          # Tell CMake's FindBLAS exactly where the library is so it doesn't
          # have to search (BLAS_INCLUDE_DIRS alone is not enough).
          echo "BLAS_LIBRARIES=${VCPKG}/installed/x64-windows/lib/libopenblas.lib" >> "$GITHUB_ENV"
          mkdir -p src-tauri/windows-resources
          cp "${OPENBLAS_BIN}/libopenblas.dll" src-tauri/windows-resources/libopenblas.dll

      - name: Download bundled base model
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p src-tauri/bundled-models
          curl -fL \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en-q5_1.bin" \
            -o src-tauri/bundled-models/ggml-base.en-q5_1.bin

      - name: Build
        shell: bash
        env:
          TAURI_BUILD_TARGET: ${{ inputs.target }}
          EXTRA_CMAKE_ARGS: ${{ inputs.extra_cmake_args }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Parse EXTRA_CMAKE_ARGS (-DKEY=VALUE) into individual env vars.
          # The cmake crate does not split CMAKE_ARGS — each GGML/WHISPER flag must be a
          # separate env var for whisper-rs-sys build.rs to pick it up as a real cmake flag.
          for flag in ${EXTRA_CMAKE_ARGS}; do
            if [[ "$flag" =~ ^-D([A-Z_0-9]+)=(.+)$ ]]; then
              export "${BASH_REMATCH[1]}=${BASH_REMATCH[2]}"
            fi
          done
          if [[ "${{ inputs.bundle_nsis }}" == "true" ]]; then
            npm run tauri -- build --target "$TAURI_BUILD_TARGET" --bundles nsis
          else
            npm run tauri -- build --target "$TAURI_BUILD_TARGET"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_path }}
          if-no-files-found: error
