[package]
name = "ScribeFloat"
version = "0.2.195"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "ScribeFloat"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scribefloat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "scribefloat"
path = "src/bin/scribefloat.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "io-util", "macros"] }
cpal = "0.15"
hound = "3.5"
# Apple Silicon: Metal GPU (aarch64-macos target below).
# Intel macOS: Accelerate BLAS via GGML_* env vars in .cargo/config.toml.
# Windows: OpenBLAS + OpenMP (windows target below).
whisper-rs = "0.16"
num_cpus = "1.16"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
pulldown-cmark = "0.12"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
rdev = "0.5"
enigo = "0.6"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
regex = "1"
sha2 = "0.10"
sherpa-onnx = "1"
# Sortformer streaming diarization only (ASR stays whisper-rs); shares ort with fastembed.
parakeet-rs = { version = "0.3.6", features = ["sortformer"] }
pitch-detection = "0.3"
base64 = "0.22"
ring = "0.17"
fastembed = "5.17"

[target.'cfg(target_os = "macos")'.dependencies]
# Used directly for sysctlbyname in lib::log_system_info; pinned loose to match the
# version already pulled in transitively by tauri/whisper-rs/etc.
libc = "0.2"

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
whisper-rs = { version = "0.16", features = ["openblas", "openmp"] }

[dev-dependencies]
tempfile = "3"
