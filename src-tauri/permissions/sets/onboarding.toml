[[set]]
identifier = "onboarding"
description = """
App commands for the onboarding satellite window. Add new first-run invokes here.
"""
permissions = [
  "allow-settings-get-theme-mode",
  "allow-settings-permissions-status",
  "allow-settings-permissions-request",
  "allow-settings-complete-onboarding",
  "allow-settings-show-window",
  "allow-settings-get-dictate-auto-enter",
  "allow-settings-set-dictate-auto-enter"
]
