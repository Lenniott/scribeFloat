name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Each platform builds independently. One failure does not cancel the others.
  build-macos-arm:
    uses: ./.github/workflows/reusable-tauri-build.yml
    secrets: inherit
    with:
      os: macos-14
      target: aarch64-apple-darwin
      artifact_path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
      artifact_name: macos-arm-dmg
      # Native Apple Silicon. whisper-rs `metal` only — no BLAS (Metal handles everything).

  build-macos-intel:
    uses: ./.github/workflows/reusable-tauri-build.yml
    secrets: inherit
    with:
      # macos-13 retired Dec 2025 — use Intel x86_64 runner per GitHub changelog.
      # https://github.blog/changelog/2025-09-19-github-actions-macos-13-runner-image-is-closing-down/
      os: macos-15-intel
      target: x86_64-apple-darwin
      artifact_path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
      artifact_name: macos-intel-dmg
      extra_cmake_args: '-DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON -DGGML_BLAS=ON -DGGML_BLAS_VENDOR=Apple -DGGML_ACCELERATE=ON'
      timeout_minutes: 120

  build-windows:
    uses: ./.github/workflows/reusable-tauri-build.yml
    secrets: inherit
    with:
      os: windows-latest
      target: x86_64-pc-windows-msvc
      artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
      artifact_name: windows-nsis
      bundle_nsis: true

  # Publish as soon as Apple Silicon + Windows finish — do NOT wait for Intel macOS.
  # Intel often queues separately; it attaches later via attach-macos-intel.
  release:
    needs: [build-macos-arm, build-windows]
    if: ${{ always() && !cancelled() && (needs.build-macos-arm.result == 'success' || needs.build-windows.result == 'success') }}
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS Apple Silicon artifact
        if: needs.build-macos-arm.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: macos-arm-dmg
          path: artifacts/macos-arm

      - name: Rename Apple Silicon DMG
        if: needs.build-macos-arm.result == 'success'
        run: |
          for f in artifacts/macos-arm/*.dmg; do
            mv "$f" "${f/_aarch64.dmg/_apple-silicon.dmg}"
          done

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v8
        with:
          name: windows-nsis
          path: artifacts/windows

      - name: Write release notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          {
            echo "## Installation"
            echo
            if [[ "${{ needs.build-macos-arm.result }}" == "success" ]]; then
              echo "**macOS (Apple Silicon — M1/M2/M3/M4):** download the \`apple-silicon.dmg\` below, open it, and drag ScribeFloat to Applications."
              echo
            fi
            echo "**macOS (Intel):** download the \`intel.dmg\` below. It is built separately — if not yet attached, check back shortly."
            echo
            if [[ "${{ needs.build-windows.result }}" == "success" ]]; then
              echo "**Windows:** run the \`.exe\` installer below. If SmartScreen warns you, click **More info → Run anyway**."
              echo
            fi
            echo "## Build status (${TAG})"
            echo
            echo "| Platform | Status |"
            echo "|----------|--------|"
            echo "| macOS Apple Silicon | ${{ needs.build-macos-arm.result }} |"
            echo "| macOS Intel | pending (see attach-macos-intel job) |"
            echo "| Windows | ${{ needs.build-windows.result }} |"
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/**/*
          body_path: release-notes.md
          generate_release_notes: false

  # When Intel macOS finishes (even long after release), append its DMG to the same tag.
  attach-macos-intel:
    needs: [build-macos-intel, release]
    if: ${{ always() && needs.release.result == 'success' && needs.build-macos-intel.result == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-intel-dmg
          path: artifacts/macos-intel

      - name: Rename Intel DMG
        run: |
          for f in artifacts/macos-intel/*.dmg; do
            mv "$f" "${f/_x64.dmg/_intel.dmg}"
          done

      - name: Attach Intel DMG to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/macos-intel/*
          append_body: true
          body: |
            **macOS (Intel):** `intel.dmg` now attached.
