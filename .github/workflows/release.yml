name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

# Run @actions/* on Node 24 until the runner default flips (Node 20 runner removal).
# https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: universal-apple-darwin
            artifact_path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Cache Rust
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.os == 'macos-14'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        shell: bash
        env:
          TAURI_BUILD_TARGET: ${{ matrix.target }}
        run: |
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            npm run tauri -- build --target "$TAURI_BUILD_TARGET" --bundles nsis
          else
            npm run tauri -- build --target "$TAURI_BUILD_TARGET"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.os }}-artifact
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            ## Installation

            **macOS (.dmg):** Open the DMG, drag scribefloat to Applications. Because the app is not yet notarized, macOS will block it on first launch. To open it, run this once in Terminal:

                xattr -cr /Applications/scribefloat.app

            Then double-click normally. The right-click → Open bypass no longer works on macOS 15 Sequoia.

            **Windows (NSIS .exe):** Run the installer. If Windows SmartScreen warns you, click **More info → Run anyway**.
