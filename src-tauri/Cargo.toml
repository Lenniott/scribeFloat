[package]
name = "ScribeFloat"
version = "0.2.16"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "scribefloat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
cpal = "0.15"
hound = "3.5"
# Apple Silicon gets Metal GPU acceleration; other targets use the CPU build
# (Accelerate + AVX2 are wired in via `.cargo/config.toml` CMAKE_ARGS).
whisper-rs = "0.16"
num_cpus = "1.16"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "json"] }
rdev = "0.5"
enigo = "0.6"
symphonia = { version = "0.5", features = ["aac", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav"] }
regex = "1"
sha2 = "0.10"

[target.'cfg(target_os = "macos")'.dependencies]
# Used directly for sysctlbyname in lib::log_system_info; pinned loose to match the
# version already pulled in transitively by tauri/whisper-rs/etc.
libc = "0.2"

[target.'cfg(all(target_arch = "aarch64", target_os = "macos"))'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
tempfile = "3"

